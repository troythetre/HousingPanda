<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Housing Panda Submit Listing Form</title>
  </head>
  <body>
    <h1>Submit a listing</h1>
    <form id="listingForm">
      <input type="text" placeholder="Title" id="title" required />
      <textarea placeholder="Description" id="description" required></textarea>
      <input type="number" placeholder="Rent" id="rent" required />
      <input type="text" placeholder="Address" id="address" required />
      <input type="number" placeholder="Number of Rooms" id="rooms" required />
      <input type="text" placeholder="Contact Info" id="contactInfo" required />
      <button type="submit">Submit</button>
    </form>

    <p><a href="listing.html">View Current Listings</a></p>

    <script type="module" src="app.js"></script>
  </body>
</html>
